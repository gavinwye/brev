name: Bug report
description: Something in Brev isn't working right.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping test the alpha. The more specific, the faster it gets fixed.
  - type: input
    id: brev-version
    attributes:
      label: Brev version
      description: Brev → About (or the version on the download page).
      placeholder: e.g. 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. 14.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drag images/video in here if it helps. Do not include private email content.
    validations:
      required: false
